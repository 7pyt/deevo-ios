name: Deevo
options:
  bundleIdPrefix: com.y213k.deevo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Deevo:
    type: application
    platform: iOS
    sources:
      - path: Deevo
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.y213k.deevo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Build non signé : la signature se fait après coup, par toi, sur
        # l'IPA produit par GitHub Actions (voir README.md).
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: Deevo/Info.plist
